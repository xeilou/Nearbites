<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearbites | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <meta name="nearbites-guard" content="3">
        <script>
        const raw = localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user');
        if (!raw) {
            window.location.replace('/index.html');
        } else {
            const currentUser = JSON.parse(raw);
            // Force Number() to avoid string/int bugs, 3 = Admin
            if (Number(currentUser.userType) !== 3) {
                window.location.replace('/index.html');
            }
        }
    </script>
</head>
<body class="bg-gray-900 font-sans min-h-screen flex flex-col text-white selection:bg-red-500">

    <div id="nearbites-navbar"></div>

    <main class="flex-grow p-8 max-w-4xl mx-auto w-full">
        
        <div class="bg-gray-800 rounded-3xl p-8 shadow-2xl border border-gray-700">
            <div class="mb-8 border-b border-gray-700 pb-4">
                <h2 class="text-3xl font-bold text-white">Create Seller Account</h2>
                <p class="text-gray-400 mt-2">Provision a new restaurant partner for the platform.</p>
            </div>

            <form id="createSellerForm" class="space-y-6" onsubmit="handleCreateSeller(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Seller/Store Name</label>
                        <input type="text" name="username" required placeholder="e.g., Kuya Juan's Sisig"
                               class="w-full px-4 py-3 bg-gray-900 rounded-xl border border-gray-600 focus:ring-2 focus:ring-red-600 text-white outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-300 mb-2">Business Email</label>
                        <input type="email" name="email" required placeholder="contact@kuyajuan.com"
                               class="w-full px-4 py-3 bg-gray-900 rounded-xl border border-gray-600 focus:ring-2 focus:ring-red-600 text-white outline-none transition">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">Temporary Password</label>
                    <input type="text" name="password" required placeholder="Provide this to the seller"
                           class="w-full px-4 py-3 bg-gray-900 rounded-xl border border-gray-600 focus:ring-2 focus:ring-red-600 text-white outline-none transition">
                </div>

                <button type="submit" class="w-full bg-red-700 text-white font-bold py-4 rounded-xl hover:bg-red-600 transition shadow-lg shadow-red-900/50 mt-4">
                    Provision Seller Account
                </button>
            </form>
        </div>

        <div class="mt-8 bg-gray-800 rounded-3xl p-6 shadow-2xl border border-gray-700">
            <div class="mb-4 flex items-center justify-between">
                <div>
                    <h3 class="text-2xl font-bold">Manage Users</h3>
                    <p class="text-gray-400 text-sm">View and remove accounts as needed.</p>
                </div>
                <div class="w-72">
                    <input id="adminSearch" type="search" placeholder="Search users by name or email..." class="w-full px-3 py-2 rounded-lg bg-gray-900 text-white border border-gray-700 outline-none">
                </div>
            </div>
            <div id="userList" class="text-sm"></div>
        </div>

    </main>

    <script src="/js/ui.js"></script>
    <script>
        (function(){
            const currentUser = window.__NEARBITES_USER || (window.Nearbites && window.Nearbites.getCurrentUser ? window.Nearbites.getCurrentUser() : null);
            if (!currentUser) return window.location.replace('/index.html');
            if (currentUser.userType !== 3) return window.location.replace('/index.html');

            const adminGreeting = document.getElementById('adminGreeting');
            if (adminGreeting) adminGreeting.innerText = `Admin: ${currentUser.username}`;

            async function handleCreateSeller(event) {
                event.preventDefault();
                const formData = new FormData(event.target);
                const data = Object.fromEntries(formData.entries());
                try {
                    const response = await fetch('/api/admin/create-seller', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                    if (response.ok) {
                        alert('✅ ' + result.message);
                        event.target.reset();
                    } else {
                        alert('❌ ' + result.error);
                    }
                } catch (error) {
                    alert('Server error. Ensure your backend is running!');
                }
            }

            const form = document.getElementById('createSellerForm');
            if (form) form.addEventListener('submit', handleCreateSeller);
            // Load and manage users
            async function loadUsers() {
                try {
                    const res = await fetch('/api/admin/users');
                    const users = await res.json();
                    const q = (document.getElementById('adminSearch') && document.getElementById('adminSearch').value || '').toLowerCase().trim();
                    const container = document.getElementById('userList');
                    if (!container) return;
                    container.innerHTML = '';
                    users.filter(u => {
                        if (!q) return true;
                        return (u.username && u.username.toLowerCase().includes(q)) || (u.email && u.email.toLowerCase().includes(q));
                    }).forEach(u => {
                        const row = document.createElement('div');
                        row.className = 'flex items-center justify-between py-2 border-b border-gray-700';
                        row.innerHTML = `<div class="flex-1">${u.username} <span class="text-xs text-gray-400">(${u.email})</span></div><div class="w-32 text-right">Type: ${u.userType}</div>`;
                        const del = document.createElement('button');
                        del.className = 'ml-4 px-3 py-1 bg-red-600 rounded text-sm';
                        del.innerText = 'Delete';
                        del.addEventListener('click', async () => {
                            if (!confirm('Delete user?')) return;
                            const r = await fetch(`/api/admin/users/${u.userId}`, { method: 'DELETE' });
                            if (r.ok) loadUsers(); else alert('Failed to delete user');
                        });
                        row.appendChild(del);
                        container.appendChild(row);
                    });
                } catch (err) { console.error(err); }
            }

            document.addEventListener('DOMContentLoaded', () => {
                loadUsers();
                const s = document.getElementById('adminSearch');
                if (s) s.addEventListener('input', loadUsers);
            });
        })();
    </script>
</body>
</html>
