<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Password — Nearbites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="nearbites-guard" content="1,2,3">
    <script>
        // Check both local (Remember Me) and session storage
        const localUser = localStorage.getItem('nearbites_user');
        const sessionUser = sessionStorage.getItem('nearbites_user');
        const userStr = localUser || sessionUser;

        // Instantly bounce if no token exists
        if (!userStr) {
            window.location.replace('/index.html');
        } else {
            const currentUser = JSON.parse(userStr);
            
            // Example for Student Dashboard. Change '1' to '2' for Seller, or '3' for Admin.
            if (currentUser.userType !== 1) {
                window.location.replace('/index.html');
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">
    <div id="nearbites-navbar"></div>
    <div class="w-full max-w-md p-8 bg-white rounded-3xl shadow-lg">
        <h2 class="text-2xl font-bold mb-4">Change Password</h2>
        <p class="text-sm text-gray-500 mb-6">Create a secure password for your account.</p>

        <form id="changePasswordForm" onsubmit="handleChangePassword(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">New Password</label>
                <input id="newPassword" type="password" minlength="8" required class="mt-1 block w-full border rounded-md px-3 py-2" placeholder="At least 8 characters">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input id="confirmPassword" type="password" required class="mt-1 block w-full border rounded-md px-3 py-2">
            </div>

            <div class="flex justify-end">
                <button type="submit" class="bg-red-700 text-white px-4 py-2 rounded-xl font-bold">Save</button>
            </div>
        </form>
    </div>

    <script>
        const user = window.__NEARBITES_USER || (window.Nearbites && window.Nearbites.getCurrentUser && window.Nearbites.getCurrentUser());
        if (!user) window.location.replace('/index.html');

        async function handleChangePassword(e) {
            e.preventDefault();
            const pw = document.getElementById('newPassword').value.trim();
            const cpw = document.getElementById('confirmPassword').value.trim();
            if (pw.length < 8) return alert('Password must be at least 8 characters');
            if (pw !== cpw) return alert('Passwords do not match');

            try {
                const res = await fetch('/api/users/' + user.userId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw, mustChangePassword: 0 })
                });
                const j = await res.json();
                if (!res.ok) throw new Error(j.error || 'Failed');

                // Update stored user (keep session type)
                const raw = localStorage.getItem('nearbites_user') ? localStorage.getItem('nearbites_user') : sessionStorage.getItem('nearbites_user');
                if (raw) {
                    try {
                        const obj = JSON.parse(raw);
                        obj.mustChangePassword = 0;
                        if (localStorage.getItem('nearbites_user')) localStorage.setItem('nearbites_user', JSON.stringify(obj));
                        else sessionStorage.setItem('nearbites_user', JSON.stringify(obj));
                    } catch(e){}
                }

                // Redirect to respective dashboard
                if (user.userType === 2) window.location.replace('/seller-dashboard.html');
                else if (user.userType === 3) window.location.replace('/admin-dashboard.html');
                else window.location.replace('/student-dashboard.html');

            } catch (err) {
                console.error(err);
                alert('Failed to update password.');
            }
        }
    </script>
</body>
</html>
