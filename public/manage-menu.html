<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> .hidden-by-default{display:none;} </style>
  <meta name="nearbites-guard" content="2">
  <script>
    const raw = localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user');
    if (!raw) {
        window.location.replace('/index.html');
    } else {
        const currentUser = JSON.parse(raw);
        // 2 = Seller
        if (Number(currentUser.userType) !== 2) {
            window.location.replace('/index.html');
        }
    }
</script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div id="nearbites-navbar"></div>

  <main class="max-w-6xl mx-auto p-6">
    <a href="/seller-dashboard.html" class="inline-flex items-center space-x-2 text-gray-500 hover:text-red-700 font-bold mb-6 transition">
        <span>&larr;</span> <span>Back to Stores</span>
    </a>

    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Manage Menu</h1>
        <p class="text-sm text-gray-500">Add, edit, or remove items from your store menu.</p>
      </div>
      <div id="storeInfo" class="text-sm text-gray-700"></div>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-bold mb-4">Add New Menu Item</h2>
        <form id="addFoodForm" class="space-y-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700">Name</label>
            <input name="foodName" required class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">Description</label>
            <textarea name="description" rows="3" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none"></textarea>
          </div>
          <div>
              <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Menu Category</label>
              <input type="text" name="category" id="foodCategory" placeholder="e.g., Rice Meals, Drinks, Desserts" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-red-600 outline-none transition font-medium text-gray-900">
          </div>
          <div class="col-span-full border border-red-200 bg-red-50 p-4 rounded-xl mb-4">
                <label class="block text-sm font-bold text-red-900 mb-2">Dietary Tags (Required for AI) *</label>
                <div class="flex flex-wrap gap-2 mb-3" id="presetTags">
                    <label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                        <input type="checkbox" class="tag-checkbox sr-only" value="high protein"> 
                        High Protein
                    </label>
                    <label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                        <input type="checkbox" class="tag-checkbox sr-only" value="low carb"> 
                        Low Carb
                    </label>
                    <label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                        <input type="checkbox" class="tag-checkbox sr-only" value="vegan"> 
                        Vegan
                    </label>
                    <label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                        <input type="checkbox" class="tag-checkbox sr-only" value="oil free"> 
                        Oil Free
                    </label>
                    <label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                        <input type="checkbox" class="tag-checkbox sr-only" value="spicy"> 
                        Spicy
                    </label>
                </div>
                <input type="text" id="customTags" onkeydown="createTagPill(event)" placeholder="Type a custom tag and press Enter (e.g., sweet, keto)" class="w-full px-4 py-3 rounded-xl border border-red-200 outline-none focus:ring-2 focus:ring-red-600 text-sm bg-white text-gray-900 shadow-inner">
              </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700">Price (PHP)</label>
              <input name="foodPrice" type="number" step="0.01" min="0.01" required class="w-full px-3 py-2 rounded-xl border border-gray-300" />
            </div>
            <div class="border border-gray-200 bg-gray-50 p-4 rounded-xl mt-4 col-span-full">
              <label class="block text-sm font-bold text-gray-900 mb-2">Variations (Sizes, Flavors) - Optional</label>
              <div id="variationList" class="space-y-2 mb-3"></div>
              <button type="button" onclick="addVariationRow('variationList')" class="text-sm font-bold text-red-700 hover:text-red-800">+ Add Variation Option</button>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700">Quick Serve</label>
              <select name="isQuickServe" class="w-full px-3 py-2 rounded-xl border border-gray-300">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700">Carbs (g)</label>
              <input name="carbs" type="number" min="0" step="0.1" class="w-full px-3 py-2 rounded-xl border border-gray-300" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700">Calories</label>
              <input name="calories" type="number" min="0" step="0.1" class="w-full px-3 py-2 rounded-xl border border-gray-300" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">Image</label>
            <input type="file" name="foodImage" accept="image/*" class="w-full" />
          </div>
          <div class="pt-4">
            <button type="submit" class="w-full bg-red-700 text-white py-2 rounded-xl font-bold hover:bg-red-800">Add Item</button>
          </div>
        </form>
      </div>

      <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 space-y-2 md:space-y-0">
            <h3 class="font-bold">Current Menu</h3>
            <input type="text" id="menuSearch" placeholder="🔍 Search your menu..." class="px-4 py-2 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-red-700 outline-none w-full md:w-64 bg-gray-50">
          </div>
          <div id="menuList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="editFoodModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-lg shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-bold mb-6">Edit Menu Item</h3>
            <form id="editFoodForm" class="space-y-4">
                <input type="hidden" id="editFoodId">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Name</label>
                    <input type="text" id="editFoodName" required class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Description</label>
                    <textarea id="editFoodDesc" rows="3" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Menu Category</label>
                    <input type="text" id="editFoodCategory" placeholder="e.g., Rice Meals" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none">
                </div>
                
                <div class="border border-red-200 bg-red-50 p-4 rounded-xl">
                    <label class="block text-sm font-bold text-red-900 mb-2">Edit Dietary Tags</label>
                    <div class="flex flex-wrap gap-2 mb-3" id="editFoodTagsContainer"></div>
                    <input type="text" id="editCustomTags" onkeydown="createTagPill(event, 'editFoodTagsContainer', 'edit-tag-checkbox')" placeholder="Type a custom tag and press Enter" class="w-full px-4 py-3 rounded-xl border border-red-200 outline-none focus:ring-2 focus:ring-red-600 text-sm bg-white text-gray-900 shadow-inner">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Price (PHP)</label>
                        <input type="number" id="editFoodPrice" step="0.01" required class="w-full px-3 py-2 rounded-xl border border-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Quick Serve</label>
                        <select id="editFoodQuick" class="w-full px-3 py-2 rounded-xl border border-gray-300">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Carbs (g)</label>
                        <input type="number" id="editFoodCarbs" min="0" step="0.1" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">Calories</label>
                        <input type="number" id="editFoodCalories" min="0" step="0.1" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Update Image <span class="text-xs text-gray-400 font-normal">(Leave blank to keep current)</span></label>
                    <input type="file" id="editFoodImage" accept="image/*" class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="document.getElementById('editFoodModal').classList.add('hidden'); document.getElementById('editFoodModal').classList.remove('flex');" class="flex-1 py-3 font-bold text-gray-500">Cancel</button>
                    <button type="submit" class="flex-1 bg-red-700 text-white py-3 rounded-xl font-bold hover:bg-red-800 transition">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

  <script src="/js/ui.js"></script>
  <script>
    (function(){
      const currentUser = JSON.parse(localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user'));
      if (!currentUser) return window.location.replace('/index.html');

      const qs = new URLSearchParams(window.location.search);
      const storeId = qs.get('storeId');
      if (!storeId) {
        document.getElementById('storeInfo').innerText = 'No store selected.';
        return;
      }

      document.getElementById('storeInfo').innerText = `Store ID: ${storeId}`;

      const menuList = document.getElementById('menuList');
      const addForm = document.getElementById('addFoodForm');

      // We store the foods globally so the search bar can filter them without hitting the database again!
      window.allStoreFoods = [];

      // 1. Menu Loader
      window.loadStoreFoods = async function() {
        if (!menuList) return;
        menuList.innerHTML = '<p class="text-gray-500 italic">Loading menu...</p>';
        try {
          const res = await fetch(`/api/food/store/${encodeURIComponent(storeId)}`);
          if (!res.ok) throw new Error('Failed to load');
          window.allStoreFoods = await res.json();
          renderMenu(window.allStoreFoods);
        } catch (err) {
          menuList.innerHTML = '<p class="text-red-500 font-bold">Failed to load menu items.</p>';
        }
      };

      // 1b. Menu Renderer (Separated so the search bar can use it)
      window.renderMenu = function(foodsToRender) {
          if (!Array.isArray(foodsToRender) || foodsToRender.length === 0) {
            menuList.innerHTML = '<p class="text-gray-500 italic">No menu items found.</p>';
            return;
          }
          menuList.innerHTML = '';
          foodsToRender.forEach(f => {
            const card = document.createElement('div');
            card.className = 'bg-gray-50 rounded-2xl p-4 border border-gray-100 flex flex-col justify-between';
            
            let tagsHTML = f.foodTags ? `<div class="mt-2 flex flex-wrap gap-1">` + f.foodTags.split(',').map(t => `<span class="bg-red-50 text-red-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">${t.trim()}</span>`).join('') + `</div>` : '';

            card.innerHTML = `
              <div class="flex items-start space-x-4 mb-4">
                <img src="${f.imageUrl || 'https://placehold.co/120x80/eeeeee/a31621?text=Img'}" class="w-24 h-24 object-cover rounded-xl border border-gray-200 shadow-sm" />
                <div class="flex-1">
                  <div class="flex justify-between items-start mb-1">
                    <h4 class="font-bold text-gray-900 text-lg">${f.foodName}</h4>
                    <span class="text-red-700 font-black">₱${f.foodPrice}</span>
                  </div>
                  <p class="text-sm text-gray-500 line-clamp-2">${f.description || ''}</p>
                  ${tagsHTML}
                </div>
              </div>
            `;

            const controls = document.createElement('div');
            controls.className = 'flex items-center space-x-2 mt-auto border-t border-gray-200 pt-3';

            const editBtn = document.createElement('button');
            editBtn.className = 'flex-1 px-3 py-2 bg-white border border-gray-300 text-gray-700 rounded-xl text-sm font-bold hover:bg-gray-100 transition';
            editBtn.innerText = 'Edit';
            editBtn.addEventListener('click', () => window.openEditModal(f));

            const delBtn = document.createElement('button');
            delBtn.className = 'flex-1 px-3 py-2 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm font-bold hover:bg-red-700 hover:text-white transition';
            delBtn.innerText = 'Delete';
            delBtn.addEventListener('click', () => window.deleteFood(f.foodId));

            controls.appendChild(editBtn);
            controls.appendChild(delBtn);
            card.appendChild(controls);
            menuList.appendChild(card);
          });
      };

      // Search Bar Logic
      const searchInput = document.getElementById('menuSearch');
      if(searchInput) {
          searchInput.addEventListener('input', (e) => {
              const query = e.target.value.toLowerCase();
              const filtered = window.allStoreFoods.filter(f => 
                  f.foodName.toLowerCase().includes(query) || 
                  (f.description && f.description.toLowerCase().includes(query)) ||
                  (f.foodTags && f.foodTags.toLowerCase().includes(query))
              );
              renderMenu(filtered);
          });
      }

      // ... (Keep your existing window.uploadImage, window.createTagPill, addForm submit, variation builder, and deleteFood functions exactly as they are here) ...

      // 6. Open Edit Modal (Updated with Carbs and Calories)
      window.openEditModal = function(food) {
        document.getElementById('editFoodId').value = food.foodId;
        document.getElementById('editFoodName').value = food.foodName;
        document.getElementById('editFoodDesc').value = food.description || '';
        document.getElementById('editFoodCategory').value = food.category || 'Main Menu'; 
        document.getElementById('editFoodPrice').value = food.foodPrice;
        document.getElementById('editFoodQuick').value = food.isQuickServe;
        document.getElementById('editFoodCarbs').value = food.carbs || '';
        document.getElementById('editFoodCalories').value = food.calories || '';
        document.getElementById('editFoodImage').value = ''; // Reset the file input
        
        const editTagsContainer = document.getElementById('editFoodTagsContainer');
        const presets = ['high protein', 'low carb', 'vegan', 'oil free', 'spicy'];
        const existingTags = food.foodTags ? food.foodTags.split(',').map(t => t.trim().toLowerCase()) : [];
        
        let html = '';
        presets.forEach(p => {
            const isChecked = existingTags.includes(p) ? 'checked' : '';
            html += `<label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50"><input type="checkbox" class="edit-tag-checkbox sr-only" value="${p}" ${isChecked}> ${p}</label>`;
        });
        existingTags.forEach(t => {
            if (!presets.includes(t) && t) {
                html += `<label class="cursor-pointer border border-red-200 px-3 py-1 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50"><input type="checkbox" class="edit-tag-checkbox sr-only" value="${t}" checked> ${t}</label>`;
            }
        });
        
        editTagsContainer.innerHTML = html;
        document.getElementById('editFoodModal').classList.remove('hidden');
        document.getElementById('editFoodModal').classList.add('flex');
      };

      // 7. Edit Form Submit (Updated with Image Upload)
      const editForm = document.getElementById('editFoodForm');
      if (editForm) {
          editForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fId = document.getElementById('editFoodId').value;
            
            const selectedEditTags = Array.from(document.querySelectorAll('.edit-tag-checkbox:checked')).map(cb => cb.value);
            const customEditTagsRaw = document.getElementById('editCustomTags').value;
            if (customEditTagsRaw) {
                customEditTagsRaw.split(',').forEach(t => {
                    if (t.trim()) selectedEditTags.push(t.trim().toLowerCase());
                });
            }

            const finalTags = [...new Set(selectedEditTags)];
            if (finalTags.length === 0) return alert("You MUST select or type at least one dietary tag!");

            // Change button text to show loading state
            const saveBtn = editForm.querySelector('button[type="submit"]');
            const originalText = saveBtn.innerText;
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            const body = {
                foodName: document.getElementById('editFoodName').value,
                description: document.getElementById('editFoodDesc').value,
                category: document.getElementById('editFoodCategory').value || 'Main Menu',
                foodPrice: document.getElementById('editFoodPrice').value,
                isQuickServe: document.getElementById('editFoodQuick').value,
                carbs: document.getElementById('editFoodCarbs').value,
                calories: document.getElementById('editFoodCalories').value,
                tags: finalTags
            };

            // Check if a new image was selected
            const file = document.getElementById('editFoodImage').files[0];
            if (file) {
                const uploadedUrl = await uploadImage(file);
                if (uploadedUrl) {
                    body.imageUrl = uploadedUrl;
                }
            }

            try {
              const res = await fetch(`/api/food/${fId}`, { 
                  method: 'PUT', 
                  headers: { 'Content-Type': 'application/json' }, 
                  body: JSON.stringify(body) 
              });
              const j = await res.json();
              if (res.ok) {
                  document.getElementById('editFoodModal').classList.add('hidden');
                  document.getElementById('editFoodModal').classList.remove('flex');
                  document.getElementById('editCustomTags').value = '';
                  await loadStoreFoods(); 
              } else {
                  alert(j.error || 'Failed to update');
              }
            } catch (err) { 
                alert('Server error'); 
            } finally {
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            }
          });
      }

      // Start the page!
      loadStoreFoods();
    })();
  </script>
</body>
</html>
