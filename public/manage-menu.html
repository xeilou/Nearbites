<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manage Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style> .hidden-by-default{display:none;} </style>
  <meta name="nearbites-guard" content="2">
  <script>
    const raw = localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user');
    if (!raw) {
        window.location.replace('/index.html');
    } else {
        const currentUser = JSON.parse(raw);
        // 2 = Seller
        if (Number(currentUser.userType) !== 2) {
            window.location.replace('/index.html');
        }
    }
</script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <div id="nearbites-navbar"></div>

  <main class="max-w-6xl mx-auto p-6">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Manage Menu</h1>
        <p class="text-sm text-gray-500">Add, edit, or remove items from your store menu.</p>
      </div>
      <div id="storeInfo" class="text-sm text-gray-700"></div>
    </header>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
      <div class="col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-bold mb-4">Add New Menu Item</h2>
        <form id="addFoodForm" class="space-y-3">
          <div>
            <label class="block text-sm font-semibold text-gray-700">Name</label>
            <input name="foodName" required class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">Description</label>
            <textarea name="description" rows="3" class="w-full px-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700">Price (PHP)</label>
              <input name="foodPrice" type="number" step="0.01" required class="w-full px-3 py-2 rounded-xl border border-gray-300" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700">Quick Serve</label>
              <select name="isQuickServe" class="w-full px-3 py-2 rounded-xl border border-gray-300">
                <option value="0">No</option>
                <option value="1">Yes</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-semibold text-gray-700">Carbs (g)</label>
              <input name="carbs" type="number" step="0.1" class="w-full px-3 py-2 rounded-xl border border-gray-300" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700">Calories</label>
              <input name="calories" type="number" step="0.1" class="w-full px-3 py-2 rounded-xl border border-gray-300" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700">Image</label>
            <input type="file" name="foodImage" accept="image/*" class="w-full" />
          </div>
          <div class="pt-4">
            <button type="submit" class="w-full bg-red-700 text-white py-2 rounded-xl font-bold hover:bg-red-800">Add Item</button>
          </div>
        </form>
      </div>

      <div class="lg:col-span-2">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
          <h3 class="font-bold mb-4">Current Menu</h3>
          <div id="menuList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/ui.js"></script>
  <script>
    (function(){
      const currentUser = window.__NEARBITES_USER || (window.Nearbites && window.Nearbites.getCurrentUser ? window.Nearbites.getCurrentUser() : null);
      if (!currentUser) return window.location.replace('/index.html');

      const qs = new URLSearchParams(window.location.search);
      const storeId = qs.get('storeId');
      if (!storeId) {
        document.getElementById('storeInfo').innerText = 'No store selected.';
        return;
      }

      document.getElementById('storeInfo').innerText = `Store ID: ${storeId}`;

      const menuList = document.getElementById('menuList');
      const addForm = document.getElementById('addFoodForm');

      async function loadStoreFoods() {
        if (!menuList) return;
        menuList.innerHTML = '';
        try {
          const res = await fetch(`/api/food/store/${encodeURIComponent(storeId)}`);
          if (!res.ok) throw new Error('Failed to load');
          const foods = await res.json();
          if (!Array.isArray(foods) || foods.length === 0) {
            menuList.innerHTML = '<p class="text-gray-500">No menu items yet.</p>';
            return;
          }

          foods.forEach(f => {
            const card = document.createElement('div');
            card.className = 'bg-gray-50 rounded-xl p-4 border border-gray-100';
            card.innerHTML = `
              <div class="flex items-center space-x-3 mb-2">
                <img src="${f.imageUrl || 'https://placehold.co/120x80/eeeeee/a31621?text=Img'}" class="w-24 h-16 object-cover rounded-lg" />
                <div class="flex-1">
                  <div class="flex justify-between items-start">
                    <h4 class="font-bold text-gray-900">${f.foodName}</h4>
                    <span class="text-red-700 font-bold">₱${f.foodPrice}</span>
                  </div>
                  <p class="text-sm text-gray-500">${f.description || ''}</p>
                </div>
              </div>
            `;

            const controls = document.createElement('div');
            controls.className = 'flex items-center space-x-2 mt-2';

            const edit = document.createElement('button');
            edit.className = 'px-3 py-1 bg-white border rounded-lg text-sm';
            edit.innerText = 'Edit';
            edit.addEventListener('click', () => editFood(f));

            const del = document.createElement('button');
            del.className = 'px-3 py-1 bg-red-700 text-white rounded-lg text-sm';
            del.innerText = 'Delete';
            del.addEventListener('click', () => deleteFood(f.foodId));

            controls.appendChild(edit);
            controls.appendChild(del);
            card.appendChild(controls);

            menuList.appendChild(card);
          });
        } catch (err) {
          menuList.innerHTML = '<p class="text-red-500">Failed to load menu items.</p>';
        }
      }

      async function uploadImage(file) {
        try {
          const fd = new FormData();
          fd.append('foodImage', file);
          const res = await fetch('/api/food/upload', { method: 'POST', body: fd });
          if (!res.ok) throw new Error('Upload failed');
          const j = await res.json();
          return j.imageUrl;
        } catch (err) {
          console.error(err);
          return null;
        }
      }

      async function handleAdd(e) {
        e.preventDefault();
        const fm = new FormData(addForm);
        const data = Object.fromEntries(fm.entries());
        data.servedAt = storeId;

        const file = addForm.querySelector('input[type=file]')?.files?.[0];
        if (file) {
          const url = await uploadImage(file);
          if (url) data.imageUrl = url;
        }

        try {
          const res = await fetch('/api/food', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
          const j = await res.json();
          if (res.ok) {
            addForm.reset();
            await loadStoreFoods();
          } else {
            alert(j.error || 'Failed to add food.');
          }
        } catch (err) {
          alert('Server error.');
        }
      }

      async function deleteFood(foodId) {
        if (!confirm('Delete this menu item?')) return;
        try {
          const res = await fetch(`/api/food/${foodId}`, { method: 'DELETE' });
          const j = await res.json();
          if (res.ok) await loadStoreFoods(); else alert(j.error || 'Failed to delete');
        } catch (err) { alert('Server error'); }
      }

      async function editFood(food) {
        const newName = prompt('New name', food.foodName) || food.foodName;
        const newPrice = prompt('New price', food.foodPrice) || food.foodPrice;
        try {
          const res = await fetch(`/api/food/${food.foodId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ foodName: newName, foodPrice: newPrice }) });
          const j = await res.json();
          if (res.ok) await loadStoreFoods(); else alert(j.error || 'Failed to update');
        } catch (err) { alert('Server error'); }
      }

      addForm.addEventListener('submit', handleAdd);
      loadStoreFoods();
    })();
  </script>
</body>
</html>
