<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearbites | Set Preferences</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="nearbites-guard" content="1">
    <script>
        const raw = localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user');
        if (!raw) window.location.replace('/index.html');
        const currentUser = JSON.parse(raw);
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col items-center justify-center p-4 overflow-x-hidden">

    <div class="w-full max-w-xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 mb-2">Build Your Profile</h1>
            <p class="text-sm text-gray-500 mb-6">Customize your AI campus feed.</p>
            <div class="flex justify-center space-x-2 mb-2" id="progressDots">
                <div class="w-3 h-3 rounded-full bg-red-700 transition-colors duration-300"></div>
                <div class="w-3 h-3 rounded-full bg-gray-200 transition-colors duration-300"></div>
                <div class="w-3 h-3 rounded-full bg-gray-200 transition-colors duration-300"></div>
            </div>
            <p id="errorMsg" class="text-sm font-bold text-red-600 h-5"></p>
        </div>

        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden relative w-full h-[380px]">
            <div id="slider" class="flex transition-transform duration-500 ease-in-out h-full w-[300%]">
                
                <div class="w-1/3 p-8 md:p-10 flex flex-col justify-center h-full">
                    <h2 class="text-xl font-black text-gray-900 mb-2">1. Set Your Budget *</h2>
                    <p class="text-sm text-gray-500 mb-6">What is the absolute maximum you want to spend on a single meal?</p>
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-gray-400 font-bold text-lg">₱</span>
                        <input type="number" id="budgetInput" placeholder="e.g. 150" class="w-full pl-10 pr-4 py-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-700 outline-none transition font-black text-gray-900 text-lg">
                    </div>
                </div>

                <div class="w-1/3 p-8 md:p-10 flex flex-col justify-center h-full bg-red-50/30">
                    <h2 class="text-xl font-black text-red-900 mb-2">2. What do you love? *</h2>
                    <p class="text-sm text-red-700 mb-4">Select or type what you are looking for.</p>
                    <div class="flex flex-wrap gap-2 mb-4 max-h-24 overflow-y-auto" id="likesTags">
                        <label class="cursor-pointer border border-red-200 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                            <input type="checkbox" class="like-checkbox sr-only" value="high protein"> + High Protein
                        </label>
                        <label class="cursor-pointer border border-red-200 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                            <input type="checkbox" class="like-checkbox sr-only" value="low carb"> + Low Carb
                        </label>
                        <label class="cursor-pointer border border-red-200 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50">
                            <input type="checkbox" class="like-checkbox sr-only" value="vegan"> + Vegan
                        </label>
                    </div>
                    <input type="text" onkeydown="createTagPill(event, 'likesTags', 'like-checkbox', 'red')" placeholder="Type custom tag & press Enter..." class="w-full px-4 py-3 rounded-xl border border-red-200 bg-white focus:ring-2 focus:ring-red-600 outline-none text-sm transition shadow-inner">
                </div>

                <div class="w-1/3 p-8 md:p-10 flex flex-col justify-center h-full bg-gray-50/50">
                    <h2 class="text-xl font-black text-gray-900 mb-2">3. What do you hate? *</h2>
                    <p class="text-sm text-gray-500 mb-4">Allergies or foods you want the AI to hide.</p>
                    <div class="flex flex-wrap gap-2 mb-4 max-h-24 overflow-y-auto" id="dislikesTags">
                        <label class="cursor-pointer border border-gray-300 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-gray-700 has-[:checked]:bg-gray-900 has-[:checked]:text-white hover:bg-gray-100">
                            <input type="checkbox" class="dislike-checkbox sr-only" value="peanuts"> 🚫 Peanuts
                        </label>
                        <label class="cursor-pointer border border-gray-300 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-gray-700 has-[:checked]:bg-gray-900 has-[:checked]:text-white hover:bg-gray-100">
                            <input type="checkbox" class="dislike-checkbox sr-only" value="dairy"> 🚫 Dairy
                        </label>
                        <label class="cursor-pointer border border-gray-300 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-gray-700 has-[:checked]:bg-gray-900 has-[:checked]:text-white hover:bg-gray-100">
                            <input type="checkbox" class="dislike-checkbox sr-only" value="spicy"> 🚫 Spicy
                        </label>
                    </div>
                    <input type="text" onkeydown="createTagPill(event, 'dislikesTags', 'dislike-checkbox', 'gray')" placeholder="Type custom allergy & press Enter..." class="w-full px-4 py-3 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-gray-900 outline-none text-sm transition shadow-inner">
                </div>

            </div>
        </div>

        <div class="flex justify-between items-center mt-6">
            <button id="backBtn" class="text-gray-400 font-bold hover:text-gray-900 transition opacity-0 pointer-events-none px-4 py-2">&larr; Back</button>
            <button id="nextBtn" class="bg-gray-900 text-white font-bold py-3 px-8 rounded-xl hover:bg-red-700 transition shadow-md">Next Step &rarr;</button>
        </div>
    </div>

    <script>
        let currentStep = 0;
        const slider = document.getElementById('slider');
        const dots = document.getElementById('progressDots').children;
        const nextBtn = document.getElementById('nextBtn');
        const backBtn = document.getElementById('backBtn');
        const errorMsg = document.getElementById('errorMsg');

        function createTagPill(e, containerId, checkboxClass, colorTheme) {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                const input = e.target;
                const value = input.value.trim().toLowerCase().replace(',', '');
                
                if (value) {
                    // --- NEW DUPLICATE CHECK ---
                    const existingTags = Array.from(document.querySelectorAll(`.${checkboxClass}`))
                        .map(cb => cb.value.toLowerCase());
                    
                    if (existingTags.includes(value)) {
                        const msg = document.getElementById('errorMsg');
                        msg.innerText = `"${value}" is already in your list!`;
                        setTimeout(() => { if(msg.innerText.includes(value)) msg.innerText = ""; }, 2000);
                        input.value = '';
                        return;
                    }
                    // ---------------------------

                    const newLabel = document.createElement('label');
                    if (colorTheme === 'red') {
                        newLabel.className = "cursor-pointer border border-red-200 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-red-700 has-[:checked]:bg-red-700 has-[:checked]:text-white hover:bg-red-50";
                        newLabel.innerHTML = `<input type="checkbox" class="${checkboxClass} sr-only" value="${value}" checked> + ${value}`;
                    } else {
                        newLabel.className = "cursor-pointer border border-gray-300 px-3 py-1.5 rounded-full text-xs font-bold transition select-none bg-white text-gray-700 has-[:checked]:bg-gray-900 has-[:checked]:text-white hover:bg-gray-100";
                        newLabel.innerHTML = `<input type="checkbox" class="${checkboxClass} sr-only" value="${value}" checked> 🚫 ${value}`;
                    }
                    document.getElementById(containerId).appendChild(newLabel);
                    input.value = '';
                    errorMsg.innerText = ""; // Clear errors if it worked
                }
            }
        }

        function validateStep() {
            errorMsg.innerText = "";
            if (currentStep === 0) {
                const budget = document.getElementById('budgetInput').value;
                if (!budget || budget <= 0) {
                    errorMsg.innerText = "Please enter a valid budget before continuing.";
                    return false;
                }
            } else if (currentStep === 1) {
                const likes = document.querySelectorAll('.like-checkbox:checked');
                if (likes.length === 0) {
                    errorMsg.innerText = "Please select or type at least one thing you like.";
                    return false;
                }
            } else if (currentStep === 2) {
                const dislikes = document.querySelectorAll('.dislike-checkbox:checked');
                if (dislikes.length === 0) {
                    errorMsg.innerText = "Please select or type at least one allergy or dislike.";
                    return false;
                }
            }
            return true;
        }

        function updateUI() {
            // Slide the container
            slider.style.transform = `translateX(-${currentStep * (100/3)}%)`;
            
            // Update dots
            for(let i=0; i<3; i++) {
                dots[i].className = i <= currentStep ? "w-3 h-3 rounded-full bg-red-700 transition-colors duration-300" : "w-3 h-3 rounded-full bg-gray-200 transition-colors duration-300";
            }

            // Update buttons
            backBtn.className = currentStep === 0 ? "text-gray-400 font-bold transition opacity-0 pointer-events-none px-4 py-2" : "text-gray-400 font-bold hover:text-gray-900 transition px-4 py-2";
            nextBtn.innerHTML = currentStep === 2 ? "Save & Enter &rarr;" : "Next Step &rarr;";
            nextBtn.className = currentStep === 2 ? "bg-red-700 text-white font-bold py-3 px-8 rounded-xl hover:bg-red-800 transition shadow-md" : "bg-gray-900 text-white font-bold py-3 px-8 rounded-xl hover:bg-red-700 transition shadow-md";
        }

        nextBtn.addEventListener('click', async () => {
            if (!validateStep()) return;

            if (currentStep < 2) {
                currentStep++;
                updateUI();
            } else {
                // FINAL SUBMISSION
                nextBtn.disabled = true;
                nextBtn.innerText = "Saving...";

                const budget = document.getElementById('budgetInput').value;
                const likes = Array.from(document.querySelectorAll('.like-checkbox:checked')).map(cb => cb.value);
                const dislikes = Array.from(document.querySelectorAll('.dislike-checkbox:checked')).map(cb => cb.value);

                try {
                    // Wipe old prefs
                    const fetchOld = await fetch(`/api/preferences/${currentUser.userId}`);
                    const oldPrefs = await fetchOld.json();
                    for (let p of oldPrefs) {
                        await fetch(`/api/preferences/${p.preferenceId}`, { method: 'DELETE' });
                    }

                    // Save Budget
                    await fetch('/api/preferences', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: currentUser.userId, preferenceType: 'BUDGET', maxBudget: budget })
                    });

                    // Save Likes (TAG)
                    for (let tag of likes) {
                        await fetch('/api/preferences', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: currentUser.userId, preferenceType: 'TAG', description: tag })
                        });
                    }

                    // Save Dislikes (DISLIKE)
                    for (let dislike of dislikes) {
                        await fetch('/api/preferences', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: currentUser.userId, preferenceType: 'DISLIKE', description: dislike })
                        });
                    }

                    // ==========================================
                    // NEW: MARK ONBOARDING COMPLETE IN DATABASE!
                    // ==========================================
                    await fetch(`/api/users/complete-onboarding/${currentUser.userId}`, { method: 'POST' });
                    
                    // Update the local session so they don't get looped back
                    currentUser.hasCompletedOnboarding = 1;
                    if (localStorage.getItem('nearbites_user')) {
                        localStorage.setItem('nearbites_user', JSON.stringify(currentUser));
                    } else {
                        sessionStorage.setItem('nearbites_user', JSON.stringify(currentUser));
                    }

                    // Finally, teleport them to the Dashboard!
                    window.location.replace('/student-dashboard.html');
                } catch (error) {
                    errorMsg.innerText = "Connection error. Please try again.";
                    nextBtn.disabled = false;
                    nextBtn.innerText = "Save & Enter &rarr;";
                }
            }
        });

        backBtn.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                errorMsg.innerText = "";
                updateUI();
            }
        });
    </script>
</body>
</html>
