<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearbites | Seller Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="nearbites-guard" content="2">
    <script>
        const raw = localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user');
        if (!raw) {
            window.location.replace('/index.html');
        } else {
            const currentUser = JSON.parse(raw);
            if (Number(currentUser.userType) !== 2) {
                window.location.replace('/index.html');
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <div id="nearbites-navbar"></div>

    <main class="p-8 max-w-6xl mx-auto w-full">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-900">Your Stores</h2>
                <p class="text-gray-500">Manage your campus outlets and menus</p>
            </div>
            <button onclick="openStoreModal()" class="bg-red-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition">
                + Add New Store
            </button>
        </header>

        <div id="storeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="storeModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm transition-all">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="storeModalTitle" class="text-2xl font-black text-gray-900">Add New Store</h2>
                <button onclick="closeStoreModal()" class="text-gray-400 hover:text-gray-900 text-3xl font-bold transition">&times;</button>
            </div>
            
            <form id="storeForm" class="space-y-4">
                <input type="hidden" id="storeId">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Store Name</label>
                    <input type="text" id="storeName" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition font-medium">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Location</label>
                    <input type="text" id="storeLocation" required class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition font-medium">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Store Banner Image</label>
                    <input type="file" id="storeImageInput" accept="image/*" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mt-2">Recommended: Wide landscape image.</p>
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="closeStoreModal()" class="flex-1 py-3 font-bold text-gray-500 bg-gray-100 rounded-xl hover:bg-gray-200 transition">Cancel</button>
                    <button type="submit" class="flex-1 bg-red-700 text-white font-black py-3 rounded-xl hover:bg-red-800 transition shadow-lg text-lg">Save Store</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/ui.js"></script>
    <script>
        (async () => {
            const currentUser = JSON.parse(localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user'));
            if (!currentUser) return window.location.replace('/index.html');

            // 1. Render Stores (Now displays the uploaded image!)
            window.loadStores = async function() {
                const grid = document.getElementById('storeGrid');
                if (!grid) return;

                try {
                    const res = await fetch(`/api/stores/seller/${currentUser.userId}`);
                    if (!res.ok) throw new Error('Failed to fetch');
                    const stores = await res.json();
                    grid.innerHTML = '';

                    if (!Array.isArray(stores) || stores.length === 0) {
                        grid.innerHTML = '<div class="col-span-full text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200 text-gray-400"><p>You have not registered any stores yet.</p></div>';
                        return;
                    }

                    stores.forEach(store => {
                        let isActive = (store.isActive == 1 || store.isActive === undefined);
                        
                        const card = document.createElement('div');
                        card.className = `p-6 rounded-3xl shadow-sm border transition flex flex-col justify-between relative overflow-hidden ${isActive ? 'bg-white border-gray-100 hover:shadow-md' : 'bg-red-50 border-red-200 opacity-80'}`;
                        
                        let overlay = !isActive ? `
                            <div class="absolute inset-0 bg-red-900/10 backdrop-blur-[1px] z-10 flex items-center justify-center pointer-events-none">
                                <span class="bg-red-700 text-white font-black px-6 py-2 rounded-xl border-2 border-red-900 shadow-xl transform -rotate-12 text-2xl uppercase tracking-widest">Suspended</span>
                            </div>` : '';

                        // Show image if it exists, otherwise show default icon
                        let imageHTML = store.imageUrl 
                            ? `<img src="${store.imageUrl}" class="w-full h-full object-cover">`
                            : `🏪`;

                        card.innerHTML = `
                            ${overlay}
                            <div class="${!isActive ? 'opacity-50 grayscale' : ''}">
                                <div class="h-32 ${isActive ? 'bg-gray-100' : 'bg-red-100'} rounded-2xl mb-4 flex items-center justify-center text-4xl overflow-hidden relative">
                                    ${imageHTML}
                                </div>
                                <h3 class="text-xl font-bold ${isActive ? 'text-gray-900' : 'text-red-900'}">${store.storeName}</h3>
                                <p class="${isActive ? 'text-gray-500' : 'text-red-700'} text-sm mb-4">📍 ${store.storeLocation}</p>
                            </div>
                            <div class="space-y-2 mt-auto relative z-20">
                                <button onclick="window.location.href='/manage-menu.html?storeId=${store.storeId}'" class="w-full bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-black transition disabled:opacity-50 disabled:cursor-not-allowed" ${!isActive ? 'disabled' : ''}>Manage Menu</button>
                                <div class="flex space-x-2">
                                    <button onclick="editStore(${store.storeId}, '${store.storeName.replace(/'/g, "\\'")}', '${store.storeLocation.replace(/'/g, "\\'")}')" class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-xl font-bold hover:bg-gray-200 transition text-sm disabled:opacity-50 disabled:cursor-not-allowed" ${!isActive ? 'disabled' : ''}>Edit</button>
                                    <button onclick="deleteStore(${store.storeId})" class="flex-1 bg-red-50 text-red-700 border border-red-200 py-2 rounded-xl font-bold hover:bg-red-700 hover:text-white transition text-sm disabled:opacity-50 disabled:cursor-not-allowed" ${!isActive ? 'disabled' : ''}>Delete</button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } catch (err) { console.error(err); }
            };

            // 2. Open & Close Modal Functions
            window.openStoreModal = function(storeId = '', name = '', location = '') {
                document.getElementById('storeId').value = storeId;
                document.getElementById('storeName').value = name;
                document.getElementById('storeLocation').value = location;
                document.getElementById('storeImageInput').value = ''; // Reset file input
                
                document.getElementById('storeModalTitle').innerText = storeId ? "Edit Store" : "Add New Store";
                
                const modal = document.getElementById('storeModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            };

            window.closeStoreModal = function() {
                const modal = document.getElementById('storeModal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.getElementById('storeForm').reset();
            };

            window.editStore = function(storeId, currentName, currentLocation) {
                openStoreModal(storeId, currentName, currentLocation);
            };

            // 3. Save Store (Handles both POST and PUT with Cloudinary!)
            const storeForm = document.getElementById('storeForm');
            storeForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const storeId = document.getElementById('storeId').value;
                const name = document.getElementById('storeName').value;
                const location = document.getElementById('storeLocation').value;
                const imageFile = document.getElementById('storeImageInput').files[0];
                const submitBtn = e.target.querySelector('button[type="submit"]');

                submitBtn.innerText = "Saving...";
                submitBtn.disabled = true;

                try {
                    let uploadedImageUrl = null;

                    if (imageFile) {
                        const formData = new FormData();
                        formData.append('storeImage', imageFile);
                        const imgRes = await fetch('/api/stores/upload', { method: 'POST', body: formData });
                        const imgData = await imgRes.json();
                        if (imgRes.ok) uploadedImageUrl = imgData.imageUrl;
                        else throw new Error(imgData.error || "Image upload failed.");
                    }

                    const method = storeId ? 'PUT' : 'POST';
                    const endpoint = storeId ? `/api/stores/${storeId}` : '/api/stores';
                    
                    const bodyData = storeId ? 
                        { storeName: name, storeLocation: location } : 
                        { storeManager: currentUser.userId, storeName: name, storeLocation: location };
                    
                    if (uploadedImageUrl) bodyData.imageUrl = uploadedImageUrl;

                    const res = await fetch(endpoint, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData)
                    });

                    if (res.ok) {
                        closeStoreModal();
                        loadStores();
                    } else alert('Failed to save store.');
                } catch (error) {
                    alert(error.message || 'Connection error.');
                } finally {
                    submitBtn.innerText = "Save Store";
                    submitBtn.disabled = false;
                }
            });

            // 4. Delete Store
            window.deleteStore = async function(storeId) {
                if (!confirm("Are you absolutely sure you want to delete this store? This will also delete ALL food items on its menu!")) return;
                try {
                    const response = await fetch(`/api/stores/${storeId}`, { method: 'DELETE' });
                    if (response.ok) loadStores();
                    else alert("Failed to delete store.");
                } catch (error) { alert("Connection error."); }
            };

            // Start
            await loadStores();
        })();
    </script>
</body>
</html>
