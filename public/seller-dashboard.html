<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearbites | Seller Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="nearbites-guard" content="2">
    <script>
        const raw = localStorage.getItem('nearbites_user') || sessionStorage.getItem('nearbites_user');
        if (!raw) {
            window.location.replace('/index.html');
        } else {
            const currentUser = JSON.parse(raw);
            // 2 = Seller
            if (Number(currentUser.userType) !== 2) {
                window.location.replace('/index.html');
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <div id="nearbites-navbar"></div>

    <main class="p-8 max-w-6xl mx-auto w-full">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-bold text-gray-900">Your Stores</h2>
                <p class="text-gray-500">Manage your campus outlets and menus</p>
            </div>
            <button onclick="toggleModal(true)" class="bg-red-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-red-800 transition">
                + Add New Store
            </button>
        </header>

        <div id="storeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="storeModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold mb-6">Register New Outlet</h3>
            <form id="addStoreForm" class="space-y-4" onsubmit="handleCreateStore(event)">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Store Name</label>
                    <input type="text" name="storeName" required placeholder="e.g. Nearbites Coffee" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-red-700">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Location</label>
                    <input type="text" name="storeLocation" required placeholder="e.g. 2nd Floor, SHL Building" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-red-700">
                </div>
                <div class="flex space-x-3 pt-4">
                    <button type="button" onclick="toggleModal(false)" class="flex-1 py-3 font-bold text-gray-500">Cancel</button>
                    <button type="submit" class="flex-1 bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-black transition">Create Store</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/ui.js"></script>
    <script>
        (async () => {
            const currentUser = window.__NEARBITES_USER || (window.Nearbites && window.Nearbites.getCurrentUser ? window.Nearbites.getCurrentUser() : null);
            if (!currentUser) return window.location.replace('/index.html');

            const greetingEl = document.querySelector('#nearbites-navbar .font-semibold') || document.querySelector('#nearbites-navbar span');
            // Render stores
            async function loadStores() {
                const grid = document.getElementById('storeGrid');
                if (!grid) return;

                try {
                    const res = await fetch(`/api/stores/seller/${currentUser.userId}`);
                    if (!res.ok) throw new Error('Failed to fetch');
                    const stores = await res.json();
                    grid.innerHTML = '';

                    if (!Array.isArray(stores) || stores.length === 0) {
                        const no = document.createElement('div');
                        no.className = 'col-span-full text-center py-20 bg-white rounded-3xl border-2 border-dashed border-gray-200 text-gray-400';
                        no.innerHTML = '<p>You have not registered any stores yet.</p>';
                        grid.appendChild(no);
                        return;
                    }

                    stores.forEach(store => {
                        const card = document.createElement('div');
                        card.className = 'bg-white p-6 rounded-3xl shadow-sm border border-gray-100 hover:shadow-md transition';
                        card.innerHTML = `
                            <div class="h-32 bg-gray-100 rounded-2xl mb-4 flex items-center justify-center text-4xl">🏪</div>
                            <h3 class="text-xl font-bold text-gray-900">${store.storeName}</h3>
                            <p class="text-gray-500 text-sm mb-6">📍 ${store.storeLocation}</p>
                        `;
                        const btn = document.createElement('button');
                        btn.className = 'w-full bg-gray-900 text-white py-3 rounded-xl font-bold hover:bg-black transition';
                        btn.innerText = 'Manage Menu';
                        btn.addEventListener('click', () => {
                            window.location.href = `/manage-menu.html?storeId=${store.storeId}`;
                        });
                        card.appendChild(btn);
                        grid.appendChild(card);
                    });
                } catch (err) {
                    console.error(err);
                }
            }

            // Create store
            async function handleCreateStore(event) {
                event.preventDefault();
                const formData = new FormData(event.target);
                const data = Object.fromEntries(formData.entries());
                data.storeManager = currentUser.userId;

                try {
                    const res = await fetch('/api/stores', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const j = await res.json();
                    if (res.ok) {
                        toggleModal(false);
                        event.target.reset();
                        await loadStores();
                    } else {
                        alert(j.error || 'Failed to create store.');
                    }
                } catch (err) {
                    alert('Error connecting to server.');
                }
            }

            // Modal toggle
            window.toggleModal = function(show) {
                const modal = document.getElementById('storeModal');
                if (!modal) return;
                modal.classList.toggle('hidden', !show);
            };

            // Wire form
            const addForm = document.getElementById('addStoreForm');
            if (addForm) addForm.addEventListener('submit', handleCreateStore);

            // Start
            await loadStores();
        })();
    </script>
</body>
</html>
